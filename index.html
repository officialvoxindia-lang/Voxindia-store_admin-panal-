<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoxIndia Store Admin</title>
<style>
:root{--navy:#101b39;--blue:#315de8;--ink:#17213a;--muted:#64708a;--bg:#f3f6fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}
header{background:var(--navy);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:800}
main{max-width:760px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #e1e7f2;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 28px #15264b0b}
h2{margin:0 0 14px;font-size:21px}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,textarea{width:100%;border:1px solid #d6deed;border-radius:10px;padding:12px;font:15px Arial;color:var(--ink);background:white}textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 17px;background:var(--blue);color:white;font-weight:700;font-size:14px;cursor:pointer;margin:8px 5px 0 0}button.secondary{background:#eaf0ff;color:#2449c8}button:disabled{opacity:.55;cursor:wait}
.notice{padding:13px;border-radius:11px;margin:12px 0;display:none}.success{background:#e7f8ee;color:#17683b}.error{background:#fff0ef;color:#a12620}.info{background:#fff4df;color:#87500d}
.hide{display:none!important}.stat{background:#f7f9fe;padding:14px;border-radius:12px;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<header><div class="brand">VoxIndia Store – Admin</div><button id="logout" class="secondary hide">Logout</button></header>
<main>
<section class="card" id="loginCard"><h2>Admin Login</h2><p class="muted">केवल अधिकृत Google अकाउंट से लॉगिन करें।</p><button id="login">Google से Login करें</button><div id="loginMsg" class="notice error"></div></section>
<section id="dashboard" class="hide">
<div class="card"><h2>App Status</h2><div class="stat" id="currentInfo">अभी कोई ऐप प्रकाशित नहीं है।</div><div id="saveMsg" class="notice"></div><button id="editBtn">Edit APK / New APK</button></div>
<form id="appForm" class="card hide">
<h2>App Details</h2>
<label for="nameHindi">App name (Hindi)</label><input id="nameHindi" value="VoxIndia" required>
<label for="nameEnglish">App name (English)</label><input id="nameEnglish" value="VoxIndia" required>
<label for="descriptionHindi">Description (Hindi)</label><textarea id="descriptionHindi" required></textarea>
<label for="descriptionEnglish">Description (English)</label><textarea id="descriptionEnglish" required></textarea>
<div class="row"><div><label for="version">Version number</label><input id="version" placeholder="1.0.0" required></div><div><label for="updateNotes">Update notes</label><input id="updateNotes" placeholder="Initial Release"></div></div>
<label for="apkFile">Choose APK file (नया APK डालना हो तभी चुनें)</label><input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive">
<p class="small" id="oldApk">मौजूदा APK सुरक्षित रहेगी, जब तक नई APK नहीं चुनते।</p>
<div class="row"><button id="publishBtn" type="submit">Save & Publish</button><button id="cancelBtn" type="button" class="secondary">Cancel</button></div>
<div id="formMsg" class="notice"></div>
</form>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyDiS3QVqsYlBpX7_HBUs01UR0BuFfOlCuA",
  authDomain: "voxindia-store-a9b58.firebaseapp.com",
  projectId: "voxindia-store-a9b58",
  storageBucket: "voxindia-store-a9b58.firebasestorage.app",
  messagingSenderId: "986877887799",
  appId: "1:986877887799:web:b3befa2adf8a78d47746b2",
  measurementId: "G-MS2GGLG15F"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const allowed=["official.voxindia@gmail.com","voxindia.support@gmail.com"];
const $=id=>document.getElementById(id), appRef=doc(db,"apps","voxindia");
let currentData=null,currentUser=null;
function message(el,msg,type="error"){el.textContent=msg;el.className="notice "+type;el.style.display="block";}
function hideMessage(el){el.style.display="none";}
function fillForm(d={}) {
 $("nameHindi").value=d.nameHindi||"VoxIndia";$("nameEnglish").value=d.nameEnglish||"VoxIndia";
 $("descriptionHindi").value=d.descriptionHindi||"";$("descriptionEnglish").value=d.descriptionEnglish||"";
 $("version").value=d.version||"1.0.0";$("updateNotes").value=d.updateNotes||"";
 $("apkFile").value="";$("oldApk").textContent=d.apkUrl?"मौजूदा APK मौजूद है। नई APK चुनेंगे तो वह बदल जाएगी।":"अभी कोई APK अपलोड नहीं है।";
}
function showDashboard(){
 $("loginCard").classList.add("hide");$("dashboard").classList.remove("hide");$("logout").classList.remove("hide");
}
async function loadData(){
 const s=await getDoc(appRef);currentData=s.exists()?s.data():null;
 $("currentInfo").textContent=currentData?(("Published: "+(currentData.published?"Yes":"No"))+" · Version: "+(currentData.version||"—")+" · APK: "+(currentData.apkUrl?"Uploaded":"Not uploaded")):"अभी कोई ऐप प्रकाशित नहीं है।";
 fillForm(currentData||{});
}
$("login").addEventListener("click",async()=>{
 hideMessage($("loginMsg"));
 try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,provider);}
 catch(e){message($("loginMsg"),e.message||"Login failed");}
});
$("logout").addEventListener("click",()=>signOut(auth));
onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(user){
  if(!user.emailVerified||!allowed.includes((user.email||"").toLowerCase())){await signOut(auth);message($("loginMsg"),"यह Google अकाउंट Admin के लिए अधिकृत नहीं है।");return;}
  showDashboard();
  try{await loadData();}catch(e){message($("saveMsg"),"Firebase data पढ़ने में समस्या: "+e.message);}
 }else{$("loginCard").classList.remove("hide");$("dashboard").classList.add("hide");$("logout").classList.add("hide");}
});
$("editBtn").addEventListener("click",()=>{$("appForm").classList.remove("hide");hideMessage($("saveMsg"));});
$("cancelBtn").addEventListener("click",()=>{$("appForm").classList.add("hide");fillForm(currentData||{});});
$("appForm").addEventListener("submit",async ev=>{
 ev.preventDefault();hideMessage($("formMsg"));
 const file=$("apkFile").files[0];
 if(!currentData?.apkUrl&&!file){message($("formMsg"),"पहली बार प्रकाशित करने के लिए APK file चुनना जरूरी है।");return;}
 if(file&&(!file.name.toLowerCase().endsWith(".apk")||file.size>200*1024*1024)){message($("formMsg"),"कृपया 200 MB से छोटी सही .apk फाइल चुनें।");return;}
 $("publishBtn").disabled=true;$("publishBtn").textContent="Publishing…";
 try{
  let apkUrl=currentData?.apkUrl||"",apkPath=currentData?.apkPath||"";
  if(file){
   const path="apps/voxindia/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const uploaded=await uploadBytes(ref(storage,path),file,{contentType:"application/vnd.android.package-archive"});
   apkUrl=await getDownloadURL(uploaded.ref);apkPath=path;
  }
  const payload={
   nameHindi:$("nameHindi").value.trim(),nameEnglish:$("nameEnglish").value.trim(),
   descriptionHindi:$("descriptionHindi").value.trim(),descriptionEnglish:$("descriptionEnglish").value.trim(),
   version:$("version").value.trim(),updateNotes:$("updateNotes").value.trim(),
   apkUrl,apkPath,published:true,updatedAt:serverTimestamp()
  };
  await setDoc(appRef,payload,{merge:true});
  currentData={...currentData,...payload};
  $("currentInfo").textContent="Published: Yes · Version: "+payload.version+" · APK: Uploaded";
  $("appForm").classList.add("hide");
  message($("saveMsg"),"Successful! VoxIndia की जानकारी और APK सफलतापूर्वक प्रकाशित हो गई है। Main Website पर कुछ सेकंड बाद रिफ्रेश करके देखें।","success");
 }catch(e){console.error(e);message($("formMsg"),"Publish नहीं हुआ: "+(e.message||"Unknown error"));}
 finally{$("publishBtn").disabled=false;$("publishBtn").textContent="Save & Publish";}
});
</script></body></html>
